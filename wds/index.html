<!DOCTYPE html>
<html>
<head>
   <title>WaveDAQ</title>
   <link href="wds.css" rel="stylesheet" rel="stylesheet" type="text/css">
   <link href="favicon.png" rel="shortcut icon" type="image/png" title="WaveDAQ Icon">
   <script src="controls.js" type="text/javascript"></script>
   <script src="wds.js" type="text/javascript"></script>
</head>
<body onload="init();">
<canvas id="scope">Your webbrowser does not support the WaveDAQ application</canvas>
<!-- <div id="debug">Debug</div> -->
<div class="controls" id="controls">
   <button class="startButton" type="button" id="btnStop" onClick="btnStop()">Stop</button>
   <button class="startButton" type="button" id="btnSingle" onClick="btnSingle()">Single</button><br />
   <table class="centered">
      <tr>
         <td><button class="colorButton" id="ch0" type="button" onClick="btnChn(0)">0</button></td>
         <td><button class="colorButton" id="ch1" type="button" onClick="btnChn(1)">1</button></td>
         <td><button class="colorButton" id="ch2" type="button" onClick="btnChn(2)">2</button></td>
         <td><button class="colorButton" id="ch3" type="button" onClick="btnChn(3)">3</button></td>
      </tr>
      <tr>
         <td><button class="colorButton" id="ch4" type="button" onClick="btnChn(4)">4</button></td>
         <td><button class="colorButton" id="ch5" type="button" onClick="btnChn(5)">5</button></td>
         <td><button class="colorButton" id="ch6" type="button" onClick="btnChn(6)">6</button></td>
         <td><button class="colorButton" id="ch7" type="button" onClick="btnChn(7)">7</button></td>
      </tr>
      <tr>
         <td><button class="colorButton" id="ch8" type="button" onClick="btnChn(8)">8</button></td>
         <td><button class="colorButton" id="ch9" type="button" onClick="btnChn(9)">9</button></td>
         <td><button class="colorButton" id="ch10" type="button" onClick="btnChn(10)">10</button></td>
         <td><button class="colorButton" id="ch11" type="button" onClick="btnChn(11)">11</button></td>
      </tr>
      <tr>
         <td><button class="colorButton" id="ch12" type="button" onClick="btnChn(12)">12</button></td>
         <td><button class="colorButton" id="ch13" type="button" onClick="btnChn(13)">13</button></td>
         <td><button class="colorButton" id="ch14" type="button" onClick="btnChn(14)">14</button></td>
         <td><button class="colorButton" id="ch15" type="button" onClick="btnChn(15)">15</button></td>
      </tr>
      <tr>
         <td colspan=2><button class="startButton" id="chAll" type="button" onClick="btnChn(-1)">All</button></td>
         <td colspan=2><button class="startButton" id="chOn" type="button" onClick="btnOn()">Off</button></td>
      </tr>
   </table>
   <table class="centered">
      <tr>
         <td>
            <button class="colorButton" id="scaleUp" type="button" onClick="btnScale(1)">
               <canvas name="ctrlButtonUp">^</canvas>
            </button><br />
            <div id="UScale">100 mV</div>
            <button class="colorButton" id="scaleDown" type="button" onClick="btnScale(-1)">
               <canvas name="ctrlButtonDown">v</canvas>
            </button>
         </td>
         <td>
            <canvas name="ctrlVSlider" width="40" height="112">|</canvas>
         </td>
         <td>
         <button class="highButton" id="ofsZero" type="button" onClick="btnOfsZero()">
            <canvas name="ctrlButtonZero">^</canvas>
         </button><br />
         <button class="highButton" id="ofsDistr" type="button" onClick="btnOfsDistr()">
            <canvas name="ctrlButtonDistr">^</canvas>
         </button>
         </td>
      </tr>
   </table>
</div>

</body>
</html>
